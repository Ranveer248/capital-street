<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capital Street · Capital Island sample</title>
<meta name="theme-color" content="#14205a">
<link rel="icon" href="../../icons/icon-192.png">
<link href="../../fonts/fonts.css" rel="stylesheet">
<style>
/* Capital Island sample 3. Interface after the Cargo Run screens and the reference picture: navy and gold, round icon
   buttons, compact pills, one panel at a time. Everything sits at the edges so the island stays in view. */
:root {
  --navy: #14205a; --navy2: #1d2c78; --ol: #0a0f2e; --gold: #ffc93c; --gold2: #f2a900; --ink: #fff; --dim: #b9c3f0; --cream: #fff8e8; --grn: #2fbf6a; --red: #f04e5e;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --nav-h: 74px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f7; color: var(--ink); font: 600 14px/1.3 Inter, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 12px; border: 2.5px solid var(--ol); background: linear-gradient(#3a4fc4, var(--navy2)); color: #fff; font: 400 16px/1 'Lilita One', sans-serif; letter-spacing: .02em; box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 var(--ol); white-space: nowrap; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 1px 0 var(--ol); }
.btn.gold { background: linear-gradient(#ffe07a, var(--gold) 50%, var(--gold2)); color: #2a1d00; }
.btn.go { background: linear-gradient(#5fe08f, #2fbf6a 55%, #229c55); }
.btn:disabled { filter: grayscale(.6) brightness(.85); opacity: .7; cursor: default; transform: none; }

/* cover: a picture, not the live world */
#cover { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: calc(16px + var(--st)) 16px calc(16px + var(--sb)); background: linear-gradient(170deg, #1e63d6, #13308f 60%, var(--navy)); overflow: auto; }
.cv { width: min(1000px, 100%); display: grid; gap: 14px; justify-items: center; }
.cv h1 { margin: 0; display: flex; align-items: center; gap: 10px; font: 400 clamp(34px, 8vw, 58px)/1 'Lilita One', sans-serif; color: #fff; text-shadow: 0 4px 0 var(--ol); -webkit-text-stroke: 2px var(--ol); paint-order: stroke fill; }
.cv h1 .sun { width: .9em; height: .9em; }
.cv .art { width: 100%; border: 4px solid var(--ol); border-radius: 20px; overflow: hidden; box-shadow: 0 6px 0 var(--ol); background: #1693d8; }
.cv .art img { display: block; width: 100%; height: auto; }
.cv p { margin: 0; color: var(--dim); text-align: center; }
.cv .btn { min-height: 58px; font-size: 26px; padding: 0 44px; border-radius: 16px; }
@media (orientation: landscape) and (min-aspect-ratio: 5/4) { .cv { grid-template-columns: 1.5fr 1fr; align-items: center; } .cv .art { grid-row: 1 / span 4; } }
@media (orientation: landscape) and (max-height: 480px) { .cv h1 { font-size: 32px; } .cv .btn { min-height: 48px; font-size: 21px; } }

/* top bar: level and next reward on the left, cash and settings on the right */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 10px 0 4px; background: rgba(20,32,90,.94); border: 2.5px solid var(--ol); border-radius: 20px; box-shadow: 0 3px 0 var(--ol); }
#lv { position: absolute; top: calc(8px + var(--st)); left: calc(8px + var(--sl)); max-width: calc(100% - 190px); }
#lv .ring { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 400 15px 'Lilita One', sans-serif; color: #2a1d00; background: conic-gradient(var(--gold) var(--p, 30%), #2a376f 0); position: relative; flex: none; }
#lv .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--gold); } #lv .ring b { position: relative; }
#lv .tx { min-width: 0; } #lv .tx b { display: block; font-size: 12px; line-height: 1.1; } #lv .tx small { display: block; color: var(--dim); font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#money { position: absolute; top: calc(8px + var(--st)); right: calc(56px + var(--sr)); padding: 0 12px 0 5px; }
#money .coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a8, var(--gold) 45%, #d99000); border: 2px solid var(--ol); }
#money b { font: 400 18px 'Lilita One', sans-serif; }
#gear { position: absolute; top: calc(8px + var(--st)); right: calc(8px + var(--sr)); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(20,32,90,.94); border: 2.5px solid var(--ol); box-shadow: 0 3px 0 var(--ol); color: var(--gold); }
#obj { position: absolute; top: calc(56px + var(--st)); left: calc(8px + var(--sl)); display: flex; align-items: center; gap: 7px; max-width: min(320px, calc(100% - 16px)); padding: 5px 9px 5px 5px; background: rgba(255,248,232,.96); color: #1b2350; border: 2.5px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); text-align: left; }
#obj .t { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--gold); flex: none; } #obj .t svg { width: 16px; height: 16px; }
#obj b { display: block; font-size: 12.5px; } #obj small { display: block; color: #5b6390; font-size: 11px; font-weight: 700; }
#obj.min .txt { display: none; }

/* the main navigation: five round buttons, like the reference */
#nav { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(6px + var(--sb)); display: flex; gap: 4px; padding: 6px 8px 4px; background: rgba(255,248,232,.97); border: 2.5px solid var(--ol); border-radius: 22px; box-shadow: 0 3px 0 var(--ol); }
#nav button { width: 62px; display: grid; justify-items: center; gap: 2px; color: var(--navy); font: 800 10px/1 Inter, sans-serif; letter-spacing: .04em; }
#nav .r { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--gold); border: 2.5px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 2px 0 var(--ol); transition: transform .12s, background .12s; }
#nav button.on .r { background: linear-gradient(#ffe07a, var(--gold2)); color: var(--navy); transform: translateY(-3px); }
#nav button.on { color: #000; }

@media (orientation: landscape) and (max-height: 500px) {
  :root { --nav-h: 52px; }
  #nav { padding: 4px 6px; border-radius: 18px; gap: 2px; } #nav button { width: 48px; font-size: 0; gap: 0; } #nav .r { width: 38px; height: 38px; } #nav .r svg.i { width: 19px; height: 19px; }
  #panel { top: calc(54px + var(--st)); bottom: calc(8px + var(--sb)); width: min(340px, 44vw); }
  #obj { top: calc(54px + var(--st)); } #toast { top: calc(54px + var(--st)); }
}
/* toast: under the top bar, away from the buttons */
#toast { position: fixed; z-index: 40; left: 50%; top: calc(100px + var(--st)); transform: translate(-50%, -8px); opacity: 0; transition: .2s; pointer-events: none; max-width: min(360px, calc(100% - 24px)); background: rgba(20,32,90,.96); border: 2.5px solid var(--ol); border-left: 7px solid var(--gold); border-radius: 12px; box-shadow: 0 3px 0 var(--ol); padding: 7px 12px; }
#toast.on { opacity: 1; transform: translate(-50%, 0); } #toast b { display: block; } #toast span { color: var(--dim); font-size: 12px; }

/* labels over the island: one level at a time, never overlapping */
.lab { position: fixed; z-index: 5; left: 0; top: 0; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .25s; will-change: transform; }
.lab.on { opacity: 1; }
.lab.island { font: 400 30px 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 5px rgba(10,15,46,.85); paint-order: stroke fill; letter-spacing: .03em; }
.lab.island.minor { font-size: 18px; -webkit-text-stroke-width: 4px; }
.lab.district { font: 400 17px 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 4px rgba(10,15,46,.8); paint-order: stroke fill; letter-spacing: .03em; }
.lab.place { font: 800 11.5px Inter, sans-serif; color: #1b2350; background: rgba(255,248,232,.96); border: 2px solid var(--ol); border-radius: 9px; padding: 3px 7px; box-shadow: 0 2px 0 var(--ol); }
.lab.place.small { font-size: 10px; padding: 2px 6px; }
.lab.place.home { background: var(--gold); }
.lab.place.sel { background: var(--navy); color: var(--gold); }

/* one panel at a time: a short bottom sheet on phones, a slim side panel on wide screens */
#panel { position: fixed; z-index: 20; left: calc(8px + var(--sl)); right: calc(8px + var(--sr)); bottom: calc(var(--nav-h) + 12px + var(--sb)); max-height: min(50vh, calc(100% - var(--nav-h) - 110px)); display: flex; flex-direction: column; background: var(--cream); color: #1b2350; border: 3px solid var(--ol); border-radius: 18px; box-shadow: 0 4px 0 var(--ol), 0 14px 30px rgba(10,15,46,.3); overflow: hidden; }
#panel header { display: flex; align-items: center; gap: 6px; padding: 7px 7px 7px 10px; background: var(--navy); color: #fff; border-bottom: 3px solid var(--ol); }
#panel header h3 { flex: 1; margin: 0; font: 400 19px/1 'Lilita One', sans-serif; letter-spacing: .02em; }
#panel header .hb { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); color: var(--gold); }
#pbody { overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; min-height: 0; } #pbody > * { flex: none; }
@media (min-width: 760px), (orientation: landscape) and (min-width: 600px) { #panel { left: auto; width: min(360px, 42vw); top: calc(56px + var(--st)); bottom: calc(var(--nav-h) + 12px + var(--sb)); max-height: none; } }
.sec { font: 800 10.5px/1 Inter, sans-serif; letter-spacing: .08em; color: #6a73a6; text-transform: uppercase; margin: 4px 2px -2px; }
.row { display: flex; align-items: center; gap: 9px; background: #fff; border: 2px solid #e3dccb; border-radius: 12px; padding: 8px; }
.row .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--gold); flex: none; } .row .ic svg { width: 19px; height: 19px; }
.row div { flex: 1; min-width: 0; } .row b { display: block; font-size: 13.5px; } .row small { display: block; color: #5b6390; font-size: 11.5px; font-weight: 700; }
.row .btn { min-height: 34px; font-size: 14px; padding: 0 10px; }
.row.lock { opacity: .7; } .lockt { font: 800 10px Inter, sans-serif; color: #8a5a00; background: #ffe9a8; border-radius: 99px; padding: 3px 7px; white-space: nowrap; }
.chip { display: inline-block; font: 800 10px/1 Inter, sans-serif; letter-spacing: .05em; padding: 4px 7px; border-radius: 99px; color: #fff; background: #6a73a6; white-space: nowrap; }
.chip.loading { background: #f2a900; color: #2a1d00; } .chip.travelling { background: #2e74c9; } .chip.delivered { background: var(--grn); } .chip.failed { background: var(--red); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pc { position: relative; text-align: left; background: #fff; border: 2px solid #e3dccb; border-radius: 12px; overflow: hidden; display: grid; }
.ph { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(160deg, #a9dcf2, #dff2d0); overflow: hidden; display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ph.wait::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 200% 100%; animation: sh 1.2s linear infinite; } @keyframes sh { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.pc .tx { padding: 6px 8px 8px; } .pc b { display: block; font-size: 12.5px; } .pc small { display: block; color: #5b6390; font-size: 11px; font-weight: 700; } .pc em { font: 400 16px 'Lilita One', sans-serif; font-style: normal; color: #1d5fbf; }
.tag { position: absolute; left: 6px; top: 6px; font: 800 9.5px/1 Inter, sans-serif; letter-spacing: .05em; padding: 4px 6px; border-radius: 99px; background: rgba(10,15,46,.8); color: #fff; }
.tag.yours { background: var(--grn); }
.big { font: 400 20px 'Lilita One', sans-serif; display: block; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .stats div { background: #fff; border: 2px solid #e3dccb; border-radius: 10px; padding: 6px 8px; font-size: 10.5px; color: #6a73a6; font-weight: 800; } .stats b { display: block; color: #1b2350; font-size: 14px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .acts .btn { width: 100%; }
.note { color: #5b6390; font-size: 12px; margin: 0; }
.seg { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; } .seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; padding: 6px 11px; border-radius: 99px; background: #fff; border: 2px solid #e3dccb; font-weight: 800; font-size: 12px; color: #1b2350; } .seg button.on { background: var(--navy); color: var(--gold); border-color: var(--navy); }
.chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 11.5px; font-weight: 800; color: #1b2350; } .chain span { background: #fff; border: 2px solid #e3dccb; border-radius: 8px; padding: 3px 6px; } .chain i { color: #9aa1c8; font-style: normal; }
table.t { width: 100%; border-collapse: collapse; font-size: 11px; } table.t td { padding: 4px 3px; border-bottom: 1px solid #e3dccb; vertical-align: top; } table.t td:last-child { text-align: right; white-space: nowrap; }
.ok { color: #1d8a4a; font-weight: 800; } .bad { color: var(--red); font-weight: 800; }
.bar { height: 8px; border-radius: 99px; background: #e3dccb; overflow: hidden; margin-top: 4px; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2fbf6a, #9be15d); }
.step { background: #fff; border: 2px solid #e3dccb; border-radius: 14px; padding: 8px; display: grid; gap: 6px; } .step .sh { display: flex; align-items: center; gap: 8px; } .step .sh div { flex: 1; min-width: 0; } .step .sh b { display: block; font-size: 13.5px; } .step .sh small { color: #5b6390; font-size: 11px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--gold); font: 400 16px 'Lilita One', sans-serif; flex: none; } .step .kv { display: block; color: #5b6390; font-size: 11.5px; font-weight: 700; } .step .row { border-width: 1.5px; padding: 6px; } .step > .btn { width: 100%; }
.note.bad { color: var(--red); font-weight: 800; }
#fps { position: fixed; right: 6px; bottom: 2px; z-index: 60; font: 700 10px monospace; color: rgba(10,15,46,.65); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" hidden></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24"><path d="M14.7 2.3 9.4 7.6l2.1 2.1-8.8 8.8a1.5 1.5 0 0 0 0 2.1l.7.7a1.5 1.5 0 0 0 2.1 0l8.8-8.8 2.1 2.1 5.3-5.3z"/></symbol>
  <symbol id="i-jobs" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"/><circle cx="5.5" cy="9" r="2.4"/><circle cx="18.5" cy="9" r="2.4"/><path d="M6.5 20v-3.2c0-2.8 2.4-4.8 5.5-4.8s5.5 2 5.5 4.8V20zM1 20v-2.4c0-2 1.6-3.4 3.8-3.6-.8 1-1.3 2.2-1.3 3.6V20zm22 0h-2.5v-2.4c0-1.4-.5-2.6-1.3-3.6 2.2.2 3.8 1.6 3.8 3.6z"/></symbol>
  <symbol id="i-trade" viewBox="0 0 24 24"><path d="M2 15h20l-2.5 5h-15z"/><path d="M5 14V9h6v5zm7 0V6h5v8z"/><path d="M8 8V5h2v3z"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.4 4.9 12 10.6l5.6-5.7 1.5 1.5-5.7 5.6 5.7 5.6-1.5 1.5-5.6-5.7-5.6 5.7-1.5-1.5 5.7-5.6-5.7-5.6z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4 1.5-1.5L10.9 12l6-5.9z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6zm0-9a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></symbol>
  <symbol id="i-bank" viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7zM4 10h3v8H4zm6.5 0h3v8h-3zM17 10h3v8h-3zM2 19h20v3H2z"/></symbol>
  <symbol id="i-office" viewBox="0 0 24 24"><path d="M5 2h14v20h-5v-4h-4v4H5zm3 3v2h2V5zm6 0v2h2V5zM8 9v2h2V9zm6 0v2h2V9zm-6 4v2h2v-2zm6 0v2h2v-2z"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M1 5h13v11H1zm14 3h4l4 4v4h-8z"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9zM9 7a3 3 0 0 1 6 0v2H9z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M2 17h20v2H2zm2.5-2a7.5 7.5 0 0 1 15 0z" fill="#ffc93c"/></symbol>
</svg>

<section id="cover">
  <div class="cv">
    <h1><svg class="i sun"><use href="#i-sun"/></svg>CAPITAL ISLAND</h1>
    <div class="art"><img src="art/cover.jpg" alt="Capital Island sample: a beachfront hotel, the Old Quarter, the harbour and the bridge to Industrial Isle" width="1600" height="1000"></div>
    <p>Review sample: one finished corner of the island. Your current game is not touched.</p>
    <button class="btn gold" id="play">PLAY</button>
    <p style="font-size:12px">© 2026 Pocket Rocket Studio</p>
  </div>
</section>

<div id="hud" hidden>
  <div class="pill" id="lv"><span class="ring" id="lvRing"><b id="lvN">1</b></span><span class="tx"><b id="lvT">Level 1</b><small id="lvNext">Next: delivery van</small></span></div>
  <div class="pill" id="money"><span class="coin"></span><b id="cash">$2,340</b></div>
  <button id="gear" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  <button id="obj"><span class="t"><svg class="i"><use href="#i-target"/></svg></span><span class="txt"><b id="objT">Explore the sample</b><small id="objS">Map → zoom out to see the island</small></span></button>
  <nav id="nav" aria-label="Main">
    <button data-p="home"><span class="r"><svg class="i"><use href="#i-home"/></svg></span>HOME</button>
    <button data-p="build"><span class="r"><svg class="i"><use href="#i-build"/></svg></span>BUILD</button>
    <button data-p="jobs"><span class="r"><svg class="i"><use href="#i-jobs"/></svg></span>JOBS</button>
    <button data-p="trade"><span class="r"><svg class="i"><use href="#i-trade"/></svg></span>TRADE</button>
    <button data-p="map"><span class="r"><svg class="i"><use href="#i-map"/></svg></span>MAP</button>
  </nav>
</div>
<section id="panel" hidden><header><button class="hb" id="pBack" aria-label="Back" hidden><svg class="i"><use href="#i-back"/></svg></button><h3 id="pTitle"></h3><button class="hb" id="pX" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></header><div id="pbody"></div></section>
<div id="toast"><b id="toastT"></b><span id="toastB"></span></div>
<div id="labels"></div>
<div id="fps" hidden></div>

<script src="../../lib/three.min.js"></script>
<script src="../../lib/OrbitControls.js"></script>
<script src="world.js"></script>
<script src="app.js"></script>
</body>
</html>
