<style>
/* Capital Street, Capital Island review sample (Goal 32). Layout and palette follow the Cargo Run screens: royal-blue
   panels with a thick navy outline, chunky display type, one yellow call to action. Checkpoint 2 adds glossy buttons,
   coloured section icons, tabs, progress bars and a lifted active state in the nav. */
:root {
  --ol: #0a0f2e; --bg1: #2f6bff; --bg2: #6a3df0; --panel: #1f2a6b; --panel2: #2a3a96; --panel3: #33459f; --ink: #fff; --dim: #b7c0f0;
  --yel: #ffd21f; --yel2: #f2b705; --grn: #2fbf6a; --red: #f04e5e; --sky: #7fd0f0;
  --gloss: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.18);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 72px; --top-h: 56px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; color: var(--ink); font: 600 15px/1.3 Inter, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 3px solid var(--ol); box-shadow: var(--gloss), 0 4px 0 var(--ol);
  background: linear-gradient(#4256c4, #2f3f9e); color: #fff; font: 400 17px/1 'Lilita One', sans-serif; letter-spacing: .02em; transition: transform .08s; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: var(--gloss), 0 1px 0 var(--ol); }
.btn.pri { background: linear-gradient(#ffe25a, var(--yel) 45%, var(--yel2)); color: #2a1d00; }
.btn.go { background: linear-gradient(#5fe08f, #2fbf6a 50%, #229c55); }
.btn.big { min-height: 62px; font-size: 26px; border-radius: 18px; box-shadow: var(--gloss), 0 6px 0 var(--ol); }
.btn:disabled { filter: grayscale(.55) brightness(.85); opacity: .7; cursor: default; transform: none; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.title { font: 400 clamp(38px, 9vw, 64px)/.95 'Lilita One', sans-serif; text-align: center; color: #fff; -webkit-text-stroke: 3px var(--ol); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ol); margin: 0; }
.title b { display: inline-block; font-weight: 400; color: #2a1d00; background: var(--yel); -webkit-text-stroke: 0; text-shadow: none; padding: 2px 14px 6px; border: 3px solid var(--ol); border-radius: 14px; box-shadow: var(--gloss), 0 5px 0 var(--ol); margin-left: .12em; }

/* ---------- the cover: a picture of the island, before anything 3D loads ---------- */
#cover { position: fixed; inset: 0; z-index: 50; background: linear-gradient(165deg, var(--bg1), var(--bg2)); display: grid; overflow: auto;
  padding: calc(18px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l)); }
#cover::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.2), transparent 40%), radial-gradient(circle at 85% 90%, rgba(255,210,31,.16), transparent 45%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 22px, transparent 22px 44px); pointer-events: none; }
.cv { position: relative; margin: auto; width: 100%; max-width: 560px; display: grid; gap: 14px; justify-items: center; }
.cv .tag { color: #e9ecff; font-weight: 700; text-align: center; margin: -2px 0 0; }
.art { position: relative; width: 100%; border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 7px 0 var(--ol), 0 24px 50px rgba(10,15,46,.35); overflow: hidden; background: #8fd3ef; }
.art img { display: block; width: 100%; height: auto; }   /* never stretched, never cropped: the frame takes the picture's own shape */
.art .badge { position: absolute; left: 12px; top: 12px; background: rgba(10,15,46,.72); color: #fff; font: 800 11px/1 Inter, sans-serif; letter-spacing: .08em; padding: 7px 10px; border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(10,15,46,.45); border: 2px solid rgba(10,15,46,.6); color: #fff; font: 700 13px/1 Inter, sans-serif; padding: 7px 12px 7px 8px; border-radius: 99px; }
.chip svg.i { width: 18px; height: 18px; color: var(--yel); }
.cv .btn.big { width: 100%; overflow: hidden; text-overflow: ellipsis; }
.foot { color: rgba(255,255,255,.75); font-size: 12px; text-align: center; line-height: 1.5; }
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .cv { max-width: 1100px; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); align-items: center; gap: 28px; }
  .cv .art { grid-column: 1; grid-row: 1 / span 5; }
  .cv > :not(.art) { grid-column: 2; }
  .title { font-size: clamp(36px, 5.2vw, 64px); }
}
@media (orientation: landscape) and (max-height: 480px) { .cv { gap: 10px; } .chips { display: none; } .btn.big { min-height: 52px; font-size: 22px; } .title { font-size: 34px; } }

/* ---------- joining ---------- */
.ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10,15,46,.55); }
.card { position: relative; width: min(400px, 100%); background: linear-gradient(#2c3fa6, var(--panel) 60%); border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 7px 0 var(--ol); padding: 20px; display: grid; gap: 12px; }
.card .cface { width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--ol); overflow: hidden; margin: -54px auto 0; box-shadow: 0 4px 0 var(--ol); }
.card h2 { margin: 0; text-align: center; font: 400 26px/1.1 'Lilita One', sans-serif; }
.card p { margin: 0; color: var(--dim); text-align: center; }
.card label { font-weight: 800; font-size: 13px; }
.card input { width: 100%; min-height: 50px; border-radius: 14px; border: 3px solid var(--yel); background: #11163a; color: #fff; font: 700 18px Inter, sans-serif; padding: 0 14px; user-select: text; }
.swatch { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.swatch button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); }
.swatch button.on { outline: 3px solid #fff; outline-offset: 2px; }
.why { color: #ffb3bb !important; font-weight: 700; }
.steps { display: grid; gap: 6px; } .steps div { display: flex; gap: 8px; align-items: center; color: var(--dim); font-weight: 700; font-size: 14px; } .steps div.on { color: #fff; } .steps div.ok { color: #8ff0b4; }
.steps i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.steps div.on i { border-top-color: transparent; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 10px; border-radius: 99px; background: #11163a; border: 2px solid var(--ol); overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--grn), #9be15d); transition: width .25s; }

/* ---------- the game screen: a slim top bar, the city, one row of navigation ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#top { position: absolute; top: calc(8px + var(--safe-t)); left: calc(8px + var(--safe-l)); right: calc(8px + var(--safe-r)); display: flex; align-items: center; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 6px; background: linear-gradient(#2c3fa6, var(--panel)); border: 3px solid var(--ol); border-radius: 16px; box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 var(--ol); }
.who .av { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font: 400 18px 'Lilita One', sans-serif; border: 2px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); color: #fff; text-shadow: 0 2px 0 rgba(10,15,46,.5); }
.who b { display: block; font-size: 13px; line-height: 1.1; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .lv { display: flex; align-items: center; gap: 6px; margin-top: 3px; } .who .lv span { background: var(--yel); color: #2a1d00; font: 800 10px/1 Inter, sans-serif; padding: 3px 6px; border-radius: 6px; border: 2px solid var(--ol); }
.who .lv u { display: block; width: 52px; height: 6px; border-radius: 9px; background: #11163a; overflow: hidden; text-decoration: none; } .who .lv u i { display: block; height: 100%; background: var(--yel); }
.cash { margin-left: auto; padding-left: 8px; } .cash .coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a8, var(--yel) 45%, #e0a000); border: 2px solid var(--ol); }
.cash div b { display: block; font: 400 19px/1 'Lilita One', sans-serif; } .cash div small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; margin-top: 2px; white-space: nowrap; } .cash small.late { color: #ffb3bb; }
.sq { width: 46px; height: 46px; display: grid; place-items: center; background: linear-gradient(#2c3fa6, var(--panel)); border: 3px solid var(--ol); border-radius: 14px; box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 var(--ol); }
#obj { position: absolute; top: calc(var(--top-h) + 14px + var(--safe-t)); left: calc(8px + var(--safe-l)); max-width: min(340px, calc(100% - 16px)); display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px;
  background: linear-gradient(rgba(44,63,166,.96), rgba(31,42,107,.96)); border: 3px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); text-align: left; }
#obj .t { width: 28px; height: 28px; border-radius: 9px; background: var(--yel); color: #2a1d00; display: grid; place-items: center; flex: none; border: 2px solid var(--ol); }
#obj b { display: block; font-size: 13px; } #obj small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; }
#obj.min span.txt { display: none; } #obj .chev { transition: transform .15s; } #obj.min .chev { transform: rotate(180deg); }
#nav { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--safe-b)); display: flex; gap: 2px; padding: 6px; background: linear-gradient(#2c3fa6, var(--panel)); border: 3px solid var(--ol); border-radius: 22px; box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 4px 0 var(--ol); max-width: calc(100% - 16px); }
#nav button { width: 58px; height: 56px; border-radius: 15px; display: grid; justify-items: center; align-content: center; gap: 3px; color: #e6eaff; font: 800 10px/1 Inter, sans-serif; position: relative; transition: transform .12s; }
#nav button .ni { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: var(--c); border: 2px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); color: #fff; }
#nav button .ni svg.i { width: 19px; height: 19px; }
#nav button.on { background: var(--yel); color: #2a1d00; border: 2px solid var(--ol); transform: translateY(-7px); box-shadow: var(--gloss), 0 4px 0 var(--ol); }
#nav button.locked { opacity: .55; } #nav button.locked::after { content: ''; position: absolute; right: 6px; top: 5px; width: 8px; height: 8px; border-radius: 3px; background: #aeb7ea; }
#nav .dot { position: absolute; right: 3px; top: 1px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; border: 2px solid var(--ol); font: 800 10px/14px Inter, sans-serif; }
#toast { position: fixed; z-index: 40; left: 50%; top: calc(var(--top-h) + 70px + var(--safe-t)); /* below the objective, never over the top bar */ transform: translate(-50%, -10px); opacity: 0; transition: .2s; pointer-events: none;
  background: linear-gradient(#2c3fa6, var(--panel)); border: 3px solid var(--ol); border-left: 8px solid var(--yel); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); padding: 9px 14px; max-width: min(380px, calc(100% - 24px)); text-align: left; }
@media (min-width: 760px), (orientation: landscape) and (min-width: 640px) { body.pOpen #toast { left: calc((100% - min(410px, 44vw) - 20px) / 2); } } /* beside the side panel, not over it */
#toast.on { opacity: 1; transform: translate(-50%, 0); } #toast.good { border-left-color: var(--grn); } #toast b { display: block; } #toast span { color: var(--dim); font-size: 13px; }
.lab { position: fixed; z-index: 5; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; }
.lab.home, .lab.job { display: flex; align-items: center; gap: 4px; background: var(--yel); color: #2a1d00; border: 3px solid var(--ol); border-radius: 12px; padding: 3px 9px 3px 6px; font: 400 14px 'Lilita One', sans-serif; box-shadow: var(--gloss), 0 3px 0 var(--ol); }
.lab.job { background: #fff; font-size: 12px; } .lab svg.i { width: 16px; height: 16px; }
.lab.dist { font: 400 16px 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 3px rgba(10,15,46,.85); paint-order: stroke fill; letter-spacing: .04em; transform: translate(-50%, -50%); }
.lab.isle { font-size: 22px; color: var(--yel); }

/* ---------- one panel at a time: a bottom sheet on phones, a side panel on wider screens ---------- */
#panel { position: fixed; z-index: 20; left: calc(8px + var(--safe-l)); right: calc(8px + var(--safe-r)); bottom: calc(var(--nav-h) + 16px + var(--safe-b)); max-height: min(62vh, calc(100% - var(--nav-h) - var(--top-h) - 40px - var(--safe-t) - var(--safe-b)));
  background: linear-gradient(#2a3c9f, var(--panel) 220px); border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 6px 0 var(--ol), 0 18px 40px rgba(10,15,46,.35); display: flex; flex-direction: column; overflow: hidden; }
#panel header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 9px 10px; border-bottom: 3px solid var(--ol); background: linear-gradient(#3a50c0, #2a3a96); box-shadow: inset 0 2px 0 rgba(255,255,255,.2); }
#panel header .hi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; border: 2px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); color: #fff; flex: none; }
#panel header .ht { flex: 1; min-width: 0; } #panel header h3 { margin: 0; font: 400 21px/1 'Lilita One', sans-serif; } #panel header small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel header .sq { width: 40px; height: 40px; box-shadow: inset 0 2px 0 rgba(255,255,255,.2); border-width: 2px; border-radius: 12px; }
#pbody { overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; min-height: 0; } #pbody > * { flex: none; } /* items keep their size and the panel scrolls */
@media (min-width: 760px), (orientation: landscape) and (min-width: 640px) {
  #panel { left: auto; right: calc(10px + var(--safe-r)); width: min(410px, 44vw); top: calc(var(--top-h) + 16px + var(--safe-t)); bottom: calc(var(--nav-h) + 18px + var(--safe-b)); max-height: none; }
}
.sec { display: flex; align-items: center; gap: 8px; font: 800 11px/1 Inter, sans-serif; letter-spacing: .08em; color: var(--dim); margin: 4px 0 -2px; text-transform: uppercase; } .sec::after { content: ''; flex: 1; height: 2px; background: rgba(183,192,240,.2); border-radius: 2px; }
.row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border: 2px solid var(--ol); border-radius: 14px; padding: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.row .ic, .task .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: #3a4fc4; border: 2px solid var(--ol); box-shadow: inset 0 2px 0 rgba(255,255,255,.3); flex: none; }
.row .ic.truck { background: #ff9f43; } .row .ic.ship { background: #2fd0c0; }
.row div { flex: 1; min-width: 0; } .row b { display: block; } .row small { display: block; color: var(--dim); font-size: 12px; font-weight: 700; } .row small b { display: inline; color: #fff; } .row b.dn { color: #ffb3bb !important; } .row b.up { color: #9ff0bf !important; }
.row .btn { min-height: 40px; padding: 0 12px; font-size: 15px; box-shadow: var(--gloss), 0 3px 0 var(--ol); }
.row.isle.here { background: rgba(255,210,31,.12); border-color: #a88a00; } .row .here { font: 800 11px Inter, sans-serif; color: var(--yel); letter-spacing: .08em; }
.row .mini { display: flex; flex-direction: column; gap: 6px; flex: none; } .row .mini .btn { min-height: 34px; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pc { position: relative; text-align: left; background: rgba(255,255,255,.07); border: 2px solid var(--ol); border-radius: 16px; overflow: hidden; display: grid; box-shadow: 0 3px 0 var(--ol); }
.pc .ph, .ph { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(160deg, #a9dcf2, #e6f4d8); display: grid; place-items: center; overflow: hidden; }
.ph.hero { border-radius: 16px; border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); }
.ph img { width: 100%; height: 100%; object-fit: contain; display: block; }   /* the picture is framed to fit: nothing cut off */
.ph .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #3c5a7a; font: 800 11px Inter, sans-serif; }
.ph .wait svg { width: 46%; height: auto; opacity: .55; }
.ph .wait::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); background-size: 200% 100%; animation: shine 1.2s linear infinite; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.pc .tx { padding: 8px 10px 10px; } .pc b { display: block; font-size: 14px; } .pc small { display: block; color: var(--dim); font-size: 12px; font-weight: 700; } .pc em { font-style: normal; color: var(--yel); font: 400 18px 'Lilita One', sans-serif; }
.tag2 { position: absolute; left: 8px; top: 8px; background: rgba(10,15,46,.78); color: #fff; font: 800 10px/1 Inter, sans-serif; padding: 5px 7px; border-radius: 99px; letter-spacing: .05em; z-index: 1; }
.tag2.lock { background: #5b5470; } .tag2.yours { background: var(--grn); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; touch-action: pan-x; } .seg::-webkit-scrollbar { display: none; } .seg button { flex: none; padding: 8px 12px; border-radius: 99px; background: #11163a; border: 2px solid var(--ol); font-weight: 800; font-size: 13px; } .seg button.on { background: var(--yel); color: #2a1d00; box-shadow: inset 0 2px 0 rgba(255,255,255,.45); }
.seg.tabs { background: #11163a; border: 2px solid var(--ol); border-radius: 16px; padding: 4px; gap: 4px; } .seg.tabs button { flex: 1; display: grid; justify-items: center; gap: 2px; border: 0; border-radius: 12px; padding: 6px 4px; background: none; font-size: 11px; min-width: 64px; } .seg.tabs button svg.i { width: 20px; height: 20px; } .seg.tabs button.on { background: var(--yel); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .stats div { background: #11163a; border-radius: 12px; padding: 8px; font-size: 11px; color: var(--dim); font-weight: 800; border: 2px solid rgba(10,15,46,.8); } .stats b { display: block; color: #fff; font-size: 15px; margin-top: 3px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .acts .btn { width: 100%; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
.note.lock { color: #ffe08a; }
b.big { font: 400 22px 'Lilita One', sans-serif; display: block; }
.task { display: flex; align-items: center; gap: 10px; background: rgba(47,191,106,.14); border: 2px solid #1d7a45; border-radius: 14px; padding: 8px 10px; }
.task div { flex: 1; min-width: 0; } .task b { display: block; font-size: 13px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .task .bar { height: 9px; } .task .tl { font: 400 16px 'Lilita One', sans-serif; color: #9ff0bf; }
.task .bar i { transition: width 1s linear; }
.jcard { display: grid; grid-template-columns: 120px 1fr; gap: 10px; background: rgba(255,255,255,.07); border: 2px solid var(--ol); border-radius: 16px; padding: 8px; }
.jcard .ph { border-radius: 12px; aspect-ratio: auto; min-height: 100px; } .jcard .jt { display: grid; gap: 6px; min-width: 0; } .jcard small { color: var(--dim); font-size: 12px; font-weight: 700; }
.jcard .kv { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--dim); font-weight: 700; } .jcard .kv b { color: #fff; } .jcard .acts .btn { min-height: 40px; font-size: 15px; padding: 0 8px; }
@media (max-width: 380px) { .jcard { grid-template-columns: 1fr; } .jcard .ph { aspect-ratio: 16 / 9; } }
.chip2 { display: inline-flex; align-items: center; gap: 3px; background: #11163a; border-radius: 99px; padding: 1px 7px 1px 4px; color: #fff; font-weight: 800; } .chip2 svg.i { width: 15px; height: 15px; color: #c79a5f; } .chip2.has { background: #6b4a24; }
.ledger { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; background: #11163a; border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--dim); font-weight: 700; } .ledger b { color: #fff; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; } .dist { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.07); border: 2px solid var(--ol); font-weight: 800; font-size: 13px; text-align: left; }

/* ---------- Ollie, the guide ---------- */
#guide { position: fixed; z-index: 30; left: calc(10px + var(--safe-l)); bottom: calc(var(--nav-h) + 22px + var(--safe-b)); width: min(360px, calc(100% - 20px)); display: flex; gap: 10px; align-items: flex-end; pointer-events: none; }
#guide .face { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); background: var(--sky); overflow: hidden; pointer-events: auto; }
#guide .bub { pointer-events: auto; position: relative; flex: 1; background: #fff; color: #1b2350; border: 3px solid var(--ol); border-radius: 16px; box-shadow: 0 4px 0 var(--ol); padding: 10px 12px; }
#guide .bub small { display: block; font: 800 10px/1 Inter, sans-serif; letter-spacing: .08em; color: #6a73a6; margin-bottom: 4px; }
#guide .bub p { margin: 0; font-size: 14px; line-height: 1.35; } #guide .bub p b { color: #2f5bff; }
#guide .bub .gb { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
#guide .bub .gb button.skip { color: #6a73a6; font-weight: 800; font-size: 12px; text-decoration: underline; min-height: 32px; }
#guide .bub .btn { min-height: 38px; font-size: 15px; padding: 0 14px; box-shadow: var(--gloss), 0 3px 0 var(--ol); }
#guide.top { bottom: auto; top: calc(var(--top-h) + 64px + var(--safe-t)); }
.glow { box-shadow: 0 0 0 4px var(--yel), 0 0 18px 6px rgba(255,210,31,.7) !important; animation: pulse 1.1s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--yel), 0 0 6px 2px rgba(255,210,31,.4) !important; } }
#fps { position: fixed; z-index: 70; right: 6px; bottom: 2px; font: 700 10px monospace; color: rgba(10,15,46,.6); pointer-events: none; }
</style>
</head>
