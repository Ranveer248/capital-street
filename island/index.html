<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capital Street · Capital Island preview</title>
<meta name="theme-color" content="#2f5bff">

<style>
/* Capital Street, Capital Island review sample (Goal 32). Layout and palette follow the Cargo Run screens: royal-blue
   panels with a thick navy outline, chunky display type, one yellow call to action, generous spacing. */
:root {
  --ol: #0a0f2e; --bg1: #2f6bff; --bg2: #6a3df0; --panel: #1f2a6b; --panel2: #263480; --ink: #fff; --dim: #aeb7ea;
  --yel: #ffd21f; --yel2: #f2b705; --grn: #2fbf6a; --red: #f04e5e; --sky: #7fd0f0;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 66px; --top-h: 56px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; color: var(--ink); font: 600 15px/1.3 Inter, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol);
  background: var(--panel2); color: #fff; font: 400 17px/1 'Lilita One', sans-serif; letter-spacing: .02em; transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
.btn.pri { background: linear-gradient(var(--yel), var(--yel2)); color: #2a1d00; }
.btn.go { background: linear-gradient(#45d27f, #24a95a); }
.btn.big { min-height: 62px; font-size: 26px; border-radius: 18px; box-shadow: 0 6px 0 var(--ol); }
.btn:disabled { opacity: .6; cursor: default; transform: none; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.title { font: 400 clamp(38px, 9vw, 64px)/.95 'Lilita One', sans-serif; text-align: center; color: #fff; -webkit-text-stroke: 3px var(--ol); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ol); margin: 0; }
.title b { display: inline-block; font-weight: 400; color: #2a1d00; background: var(--yel); -webkit-text-stroke: 0; text-shadow: none; padding: 2px 14px 6px; border: 3px solid var(--ol); border-radius: 14px; box-shadow: 0 5px 0 var(--ol); margin-left: .12em; }

/* ---------- the cover: a painted island, before anything 3D loads ---------- */
#cover { position: fixed; inset: 0; z-index: 50; background: linear-gradient(165deg, var(--bg1), var(--bg2)); display: grid; overflow: auto;
  padding: calc(18px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l)); }
#cover::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 40%), radial-gradient(circle at 85% 90%, rgba(255,210,31,.14), transparent 45%); pointer-events: none; }
.cv { position: relative; margin: auto; width: 100%; max-width: 560px; display: grid; gap: 14px; justify-items: center; }
.cv .tag { color: #e9ecff; font-weight: 700; text-align: center; margin: -2px 0 0; }
.art { position: relative; width: 100%; border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 7px 0 var(--ol), 0 24px 50px rgba(10,15,46,.35); overflow: hidden; background: #8fd3ef; }
.art img { display: block; width: 100%; height: auto; }   /* never stretched, never cropped: the frame takes the picture's own shape */
.art .badge { position: absolute; left: 12px; top: 12px; background: rgba(10,15,46,.72); color: #fff; font: 800 11px/1 Inter, sans-serif; letter-spacing: .08em; padding: 7px 10px; border-radius: 99px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { background: rgba(10,15,46,.45); border: 2px solid rgba(10,15,46,.6); color: #fff; font: 700 13px/1 Inter, sans-serif; padding: 8px 12px; border-radius: 99px; }
.chip b { color: var(--yel); }
.cv .btn.big { width: 100%; }
.foot { color: rgba(255,255,255,.75); font-size: 12px; text-align: center; line-height: 1.5; }
.foot a { color: var(--yel); }
@media (orientation: landscape) and (min-aspect-ratio: 5/4) {
  .cv { max-width: 1100px; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr); align-items: center; gap: 28px; }
  .cv .art { grid-column: 1; grid-row: 1 / span 5; }
  .cv > :not(.art) { grid-column: 2; }
  .title { font-size: clamp(36px, 5.2vw, 64px); }
}
@media (orientation: landscape) and (max-height: 480px) { .cv { gap: 10px; } .chips { display: none; } .btn.big { min-height: 52px; font-size: 22px; } .title { font-size: 34px; } }

/* ---------- joining ---------- */
.ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10,15,46,.55); }
.card { width: min(400px, 100%); background: var(--panel); border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 7px 0 var(--ol); padding: 20px; display: grid; gap: 12px; }
.card h2 { margin: 0; text-align: center; font: 400 26px/1.1 'Lilita One', sans-serif; }
.card p { margin: 0; color: var(--dim); text-align: center; }
.card label { font-weight: 800; font-size: 13px; }
.card input { width: 100%; min-height: 50px; border-radius: 14px; border: 3px solid var(--yel); background: #11163a; color: #fff; font: 700 18px Inter, sans-serif; padding: 0 14px; user-select: text; }
.swatch { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.swatch button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ol); }
.swatch button.on { outline: 3px solid #fff; outline-offset: 2px; }
.why { color: #ffb3bb !important; font-weight: 700; }
.steps { display: grid; gap: 6px; } .steps div { display: flex; gap: 8px; align-items: center; color: var(--dim); font-weight: 700; font-size: 14px; } .steps div.on { color: #fff; } .steps div.ok { color: #8ff0b4; }
.steps i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-style: normal; font-size: 11px; }
.steps div.on i { border-top-color: transparent; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 10px; border-radius: 99px; background: #11163a; border: 2px solid var(--ol); overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--grn), #9be15d); transition: width .25s; }

/* ---------- the game screen: a slim top bar, the city, one row of navigation ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#top { position: absolute; top: calc(8px + var(--safe-t)); left: calc(8px + var(--safe-l)); right: calc(8px + var(--safe-r)); display: flex; align-items: center; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
.pill { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 6px; background: var(--panel); border: 3px solid var(--ol); border-radius: 16px; box-shadow: 0 3px 0 var(--ol); }
.who .av { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font: 400 18px 'Lilita One', sans-serif; border: 2px solid var(--ol); }
.who b { display: block; font-size: 13px; line-height: 1.1; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .lv { display: flex; align-items: center; gap: 6px; margin-top: 3px; } .who .lv span { background: var(--yel); color: #2a1d00; font: 800 10px/1 Inter, sans-serif; padding: 3px 6px; border-radius: 6px; border: 2px solid var(--ol); }
.who .lv u { display: block; width: 52px; height: 6px; border-radius: 9px; background: #11163a; overflow: hidden; text-decoration: none; } .who .lv u i { display: block; height: 100%; background: var(--yel); }
.cash { margin-left: auto; padding-left: 8px; } .cash .coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a8, var(--yel) 45%, #e0a000); border: 2px solid var(--ol); }
.cash div b { display: block; font: 400 19px/1 'Lilita One', sans-serif; } .cash div small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; margin-top: 2px; white-space: nowrap; } .cash small.late { color: #ffb3bb; }
.sq { width: 46px; height: 46px; display: grid; place-items: center; background: var(--panel); border: 3px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); }
#obj { position: absolute; top: calc(var(--top-h) + 14px + var(--safe-t)); left: calc(8px + var(--safe-l)); max-width: min(330px, calc(100% - 16px)); display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px;
  background: rgba(31,42,107,.94); border: 3px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); text-align: left; }
#obj .t { width: 28px; height: 28px; border-radius: 9px; background: var(--yel); color: #2a1d00; display: grid; place-items: center; flex: none; }
#obj b { display: block; font-size: 13px; } #obj small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; }
#obj.min span.txt { display: none; } #obj .chev { transition: transform .15s; } #obj.min .chev { transform: rotate(180deg); }
#nav { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--safe-b)); display: flex; gap: 4px; padding: 5px; background: var(--panel); border: 3px solid var(--ol); border-radius: 20px; box-shadow: 0 4px 0 var(--ol); max-width: calc(100% - 16px); }
#nav button { width: 58px; height: 52px; border-radius: 14px; display: grid; justify-items: center; align-content: center; gap: 2px; color: #dfe4ff; font: 800 10px/1 Inter, sans-serif; position: relative; }
#nav button.on { background: var(--yel); color: #2a1d00; border: 2px solid var(--ol); }
#nav button.locked { opacity: .55; } #nav button.locked::after { content: ''; position: absolute; right: 6px; top: 5px; width: 8px; height: 8px; border-radius: 3px; background: #aeb7ea; }
#toast { position: fixed; z-index: 40; left: 50%; top: calc(var(--top-h) + 70px + var(--safe-t)); /* below the objective, never over the top bar */ transform: translate(-50%, -10px); opacity: 0; transition: .2s; pointer-events: none;
  background: var(--panel); border: 3px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 var(--ol); padding: 9px 14px; max-width: min(380px, calc(100% - 24px)); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); } #toast b { display: block; } #toast span { color: var(--dim); font-size: 13px; }
.lab { position: fixed; z-index: 5; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; }
.lab.home { background: var(--yel); color: #2a1d00; border: 3px solid var(--ol); border-radius: 12px; padding: 4px 9px; font: 400 14px 'Lilita One', sans-serif; box-shadow: 0 3px 0 var(--ol); }
.lab.dist { font: 400 16px 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 3px rgba(10,15,46,.85); paint-order: stroke fill; letter-spacing: .04em; transform: translate(-50%, -50%); }

/* ---------- one panel at a time: a bottom sheet on phones, a side panel on wider screens ---------- */
#panel { position: fixed; z-index: 20; left: calc(8px + var(--safe-l)); right: calc(8px + var(--safe-r)); bottom: calc(var(--nav-h) + 14px + var(--safe-b)); max-height: min(62vh, calc(100% - var(--nav-h) - var(--top-h) - 40px - var(--safe-t) - var(--safe-b)));
  background: var(--panel); border: 4px solid var(--ol); border-radius: 22px; box-shadow: 0 6px 0 var(--ol); display: flex; flex-direction: column; overflow: hidden; }
#panel header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 14px; border-bottom: 3px solid var(--ol); background: var(--panel2); }
#panel header h3 { margin: 0; flex: 1; font: 400 21px/1 'Lilita One', sans-serif; }
#panel header .sq { width: 40px; height: 40px; box-shadow: none; border-width: 2px; }
#pbody { overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; min-height: 0; } #pbody > * { flex: none; } /* items keep their size and the panel scrolls */
@media (min-width: 760px), (orientation: landscape) and (min-width: 640px) {
  #panel { left: auto; right: calc(10px + var(--safe-r)); width: min(400px, 44vw); top: calc(var(--top-h) + 16px + var(--safe-t)); bottom: calc(var(--nav-h) + 16px + var(--safe-b)); max-height: none; }
}
.sec { font: 800 11px/1 Inter, sans-serif; letter-spacing: .08em; color: var(--dim); margin: 4px 0 -2px; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 2px solid var(--ol); border-radius: 14px; padding: 10px; }
.row .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: #11163a; flex: none; }
.row div { flex: 1; min-width: 0; } .row b { display: block; } .row small { display: block; color: var(--dim); font-size: 12px; font-weight: 700; }
.row .btn { min-height: 40px; padding: 0 12px; font-size: 15px; box-shadow: 0 3px 0 var(--ol); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pc { text-align: left; background: var(--panel2); border: 2px solid var(--ol); border-radius: 14px; overflow: hidden; display: grid; }
.pc .ph, .ph { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(160deg, #a9dcf2, #e6f4d8); display: grid; place-items: center; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: contain; display: block; }   /* the picture is framed to fit: nothing cut off */
.ph .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #3c5a7a; font: 800 11px Inter, sans-serif; }
.ph .wait svg { width: 46%; height: auto; opacity: .55; }
.ph .wait::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); background-size: 200% 100%; animation: shine 1.2s linear infinite; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.pc .tx { padding: 8px 10px 10px; } .pc b { display: block; font-size: 14px; } .pc small { display: block; color: var(--dim); font-size: 12px; font-weight: 700; } .pc em { font-style: normal; color: var(--yel); font: 400 17px 'Lilita One', sans-serif; }
.tag2 { position: absolute; left: 8px; top: 8px; background: rgba(10,15,46,.78); color: #fff; font: 800 10px/1 Inter, sans-serif; padding: 5px 7px; border-radius: 99px; letter-spacing: .05em; }
.tag2.lock { background: #5b5470; } .tag2.yours { background: var(--grn); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; touch-action: pan-x; } .seg::-webkit-scrollbar { display: none; } .seg button { flex: none; } .seg button { padding: 8px 12px; border-radius: 99px; background: #11163a; border: 2px solid var(--ol); font-weight: 800; font-size: 13px; } .seg button.on { background: var(--yel); color: #2a1d00; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .stats div { background: #11163a; border-radius: 10px; padding: 8px; font-size: 11px; color: var(--dim); font-weight: 800; } .stats b { display: block; color: #fff; font-size: 15px; margin-top: 3px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .acts .btn { width: 100%; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
.note.lock { color: #ffe08a; }

/* ---------- Ollie, the guide ---------- */
#guide { position: fixed; z-index: 30; left: calc(10px + var(--safe-l)); bottom: calc(var(--nav-h) + 18px + var(--safe-b)); width: min(360px, calc(100% - 20px)); display: flex; gap: 10px; align-items: flex-end; pointer-events: none; }
#guide .face { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid var(--ol); box-shadow: 0 3px 0 var(--ol); background: var(--sky); overflow: hidden; pointer-events: auto; }
#guide .bub { pointer-events: auto; position: relative; flex: 1; background: #fff; color: #1b2350; border: 3px solid var(--ol); border-radius: 16px; box-shadow: 0 4px 0 var(--ol); padding: 10px 12px; }
#guide .bub small { display: block; font: 800 10px/1 Inter, sans-serif; letter-spacing: .08em; color: #6a73a6; margin-bottom: 4px; }
#guide .bub p { margin: 0; font-size: 14px; line-height: 1.35; } #guide .bub p b { color: #2f5bff; }
#guide .bub .gb { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
#guide .bub .gb button.skip { color: #6a73a6; font-weight: 800; font-size: 12px; text-decoration: underline; min-height: 32px; }
#guide .bub .btn { min-height: 38px; font-size: 15px; padding: 0 14px; box-shadow: 0 3px 0 var(--ol); }
#guide.top { bottom: auto; top: calc(var(--top-h) + 64px + var(--safe-t)); }
#guide.right { left: auto; right: calc(10px + var(--safe-r)); }
.glow { box-shadow: 0 0 0 4px var(--yel), 0 0 18px 6px rgba(255,210,31,.7) !important; animation: pulse 1.1s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--yel), 0 0 6px 2px rgba(255,210,31,.4) !important; } }
#fps { position: fixed; z-index: 70; right: 6px; bottom: 2px; font: 700 10px monospace; color: rgba(10,15,46,.6); pointer-events: none; }
</style>
</head>

<!-- the cover: shows at once; nothing 3D is built until you press Play -->
<section id="cover">
  <div class="cv">
    <h1 class="title">CAPITAL <b>STREET</b></h1>
    <p class="tag">Build your fortune on Capital Island.</p>
    <div class="art"><picture><source media="(orientation: portrait)" srcset="art/cover-tall.jpg"><img id="coverImg" src="art/cover-wide.jpg" alt="Capital Island: a harbour with ships, a town of red roofs and Capital Tower above the bay" width="1600" height="1000"></picture><span class="badge">REVIEW SAMPLE</span></div>
    <div class="chips"><span class="chip"><b>1</b> island to build</span><span class="chip">Trade · ship · produce</span><span class="chip">Play with friends</span></div>
    <button class="btn pri big" id="play">PLAY</button>
    <p class="foot">A preview of the new Capital Street. Your current game is not touched.<br>© 2026 Pocket Rocket Studio</p>
  </div>
</section>

<div class="ov" id="join" hidden></div>
<div id="hud" hidden>
  <div id="top">
    <button class="pill who" id="who"><span class="av" id="av">?</span><span><b id="nm">Player</b><span class="lv"><span id="lvN">LV 1</span><u><i id="lvF" style="width:20%"></i></u></span></span></button>
    <button class="pill cash" id="cash"><span class="coin"></span><div><b id="cashV">$2,340</b><small id="rentV">Rent $650 · 3d</small></div></button>
